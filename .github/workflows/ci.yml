name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudledger
          POSTGRES_PASSWORD: cloudledger
          POSTGRES_DB: cloudledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudledger -d cloudledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cloudledger:cloudledger@localhost:5432/cloudledger
      JWT_SECRET: ci-jwt-secret-16chars
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: cloudledger-receipts-ci
      PORT: 4000
      RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform init / validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/terraform
