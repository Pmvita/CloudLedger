# Local free stack: Postgres (+ optional MinIO). No AWS required.
#
# Default (Postgres only — works when MinIO registries deny pulls):
#   docker compose up -d
#
# Full local S3 (needs registry access to pull MinIO):
#   docker compose --profile minio up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudledger
      POSTGRES_PASSWORD: cloudledger
      POSTGRES_DB: cloudledger
    ports:
      - "5432:5432"
    volumes:
      - cloudledger_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudledger -d cloudledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    profiles: ["minio"]
    # Prefer a pinned release when Docker Hub/Quay allow anonymous pulls.
    # If pull is denied, omit this profile — API still runs; receipt upload needs S3/MinIO.
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cloudledger_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cloudledger_pg:
  cloudledger_minio:
