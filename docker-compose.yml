# Local free stack: Postgres + MinIO. No AWS required.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudledger
      POSTGRES_PASSWORD: cloudledger
      POSTGRES_DB: cloudledger
    ports:
      - "5432:5432"
    volumes:
      - cloudledger_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudledger -d cloudledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cloudledger_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cloudledger_pg:
  cloudledger_minio:
